version: "3.8"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: recipes
      MYSQL_USER: recipes
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-wickedyoda/recipe-app}-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+mysqlconnector://recipes:${MYSQL_PASSWORD}@mysql:3306/recipes
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - media:/media

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-wickedyoda/recipe-app}-frontend:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
