version: "3.8"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-recipes}
      MYSQL_USER: ${MYSQL_USER:-recipes}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    image: ${BACKEND_IMAGE:-}
    pull_policy: ${BACKEND_PULL_POLICY:-never}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      MEDIA_ROOT: ${MEDIA_ROOT:-/media}
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
      PUBLIC_URL: ${PUBLIC_URL}
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - media:/media
      - backend_media:/app/backend/media

  frontend:
    image: ${FRONTEND_IMAGE:-}
    pull_policy: ${FRONTEND_PULL_POLICY:-never}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
  media:
  backend_media:
