name: Android Build & Release

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    outputs:
      apk_path: ${{ steps.upload.outputs.artifact-path }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute next alpha patch version
        id: version
        run: |
          set -e
          latest="$(
            gh release list --repo '${{ github.repository }}' --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || true
          )"
          if [[ "$latest" =~ ^alpha-1\.01\.([0-9]+)$ ]]; then
            next=$(( (${BASH_REMATCH[1]} + 1) ))
          else
            next=1
          fi
          ver="alpha-1.01.$(printf '%02d' "$next")"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android-sdk@v2
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Install Gradle 8.9
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build APK
        working-directory: ./android
        run: gradle assemble${{ github.event.inputs.build_type == 'release' && 'Release' || 'Debug' }}

      - name: Find APK path
        id: apk
        run: |
          apk_path="$(find android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [[ -z "$apk_path" ]]; then
            echo "No APK found"
            exit 1
          fi
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: whiskful-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Whiskful ${{ steps.version.outputs.version }}
          body: |
            Automated APK build for **alpha-1.01** series.
            Built from commit: `${{ github.sha }}`
            Branch: `${{ github.ref_name }}`
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
