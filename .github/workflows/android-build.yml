name: Android Build

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android-sdk@v2
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Install Gradle 8.9
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build APK
        working-directory: ./android
        run: gradle assemble${{ github.event.inputs.build_type == 'release' && 'Release' || 'Debug' }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: whiskful-apk
          path: android/app/build/outputs/apk/*/*.apk
          retention-days: 30
