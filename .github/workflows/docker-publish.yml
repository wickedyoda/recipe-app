---
name: Docker Image CI

"on":
  workflow_run:
    workflows: ["Verify & Security"]
    types:
      - completed
  workflow_dispatch:

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate timestamp
        id: timestamp
        run: echo "timestamp=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Get next alpha version
        id: versioning
        run: |
          NEXT_VERSION=$(gh release list --repo ${{ github.repository }} --limit 5 --json tagName 2>/dev/null \
            | python3 scripts/get_next_version.py)
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "Next version: $NEXT_VERSION"

      - name: Create GitHub Release for version tag
        if: github.ref == 'refs/heads/master'
        run: |
          gh release create "${{ steps.versioning.outputs.version }}" \
            --repo ${{ github.repository }} \
            --title "Recipe App ${{ steps.versioning.outputs.version }}" \
            --notes "Auto-deployed from master with CVE patches and theme fixes" \
            --prerelease 2>/dev/null || true

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}-backend:latest
            ghcr.io/${{ github.repository }}-backend:alpha-1.0
            ghcr.io/${{ github.repository }}-backend:${{ steps.versioning.outputs.version }}
            ghcr.io/${{ github.repository }}-backend:${{ steps.timestamp.outputs.timestamp }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}-frontend:latest
            ghcr.io/${{ github.repository }}-frontend:alpha-1.0
            ghcr.io/${{ github.repository }}-frontend:${{ steps.versioning.outputs.version }}
            ghcr.io/${{ github.repository }}-frontend:${{ steps.timestamp.outputs.timestamp }}
          labels: ${{ steps.meta.outputs.labels }}
